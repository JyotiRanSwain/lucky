<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collector Login — Lucky Diagnostics</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--primary-50),#f0f9ff);}
.login-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
.login-logo{width:64px;height:64px;margin:0 auto 16px;background:var(--primary-50);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;}
.login-card h1{font-size:20px;text-align:center;margin-bottom:6px;}
.login-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;}
.login-card label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;margin-bottom:14px;}
.login-card input{border:1.5px solid var(--border);border-radius:8px;padding:12px;font-size:14px;outline:none;}
.login-card input:focus{border-color:var(--primary);}
.login-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.error-msg{color:#dc2626;font-size:12px;text-align:center;margin-top:10px;display:none;}
.login-footer{
  position:fixed;
  bottom:12px;
  left:0;
  right:0;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.login-footer a{
  color:var(--primary);
  font-weight:600;
  text-decoration:none;
}

.login-footer a:hover{
  text-decoration:underline;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <img src="../images/logo.png" alt="Lucky Diagnostics Logo">
</div>
  <h1>Collector Login</h1>
  <p>Lucky Diagnostics — Sample Collection Portal</p>
  <form id="loginForm">
    <label>Mobile Number<input type="tel" id="mobile" required placeholder="10-digit mobile"></label>
    <label>Password<input type="password" id="password" required placeholder="Enter password"></label>
    <button type="submit" class="login-btn" id="loginBtn">Login</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
  <footer class="login-footer">
  Powered by <a href="https://powercloud.in/" target="_blank" rel="noopener noreferrer">Powercloud</a>
</footer>
</div>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script>
(function(){
  var S = (typeof getSession === 'function') ? getSession() : null;
  if (S && S.role === 'collector') { location.href = 'index.html'; return; }
  
  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var errEl = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    errEl.style.display = 'none';
    
    try {
      var r = await API.request('collectorLogin', {
        mobile: document.getElementById('mobile').value.trim(),
        password: document.getElementById('password').value
      });
      if (r && r.success && r.session) {
        if (typeof setSession === 'function') setSession(r.session);
        location.href = 'index.html';
      } else {
        errEl.textContent = (r && r.message) || 'Invalid credentials';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    } catch (err) {
      errEl.textContent = 'Network error. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  });
})();
</script>
</body>
</html>
